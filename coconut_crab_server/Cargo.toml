[package]
name = "coconut_crab_server"
version = "0.1.0"
authors = ["Michael Jenkins <me@jenkinsmichpa.com>"]
edition = "2024"
description = "Simulated ransomware server for incident response testing"
license = "MIT"
repository = "https://github.com/jenkinsmichpa/coconut_crab"
readme = "../README.md"
keywords = [
  "ransomware",
  "simulation",
  "incident-response",
  "education",
  "security",
]
categories = ["simulation", "security"]

[dependencies]
coconut_crab_lib = { path = "../coconut_crab_lib" }
axum = { version = "0.8.9", default-features = false, features = [
  "json",
  "tokio",
] }
axum-embed = "0.1.0"
axum-server = { version = "0.8.0", default-features = false, features = [
  "tls-rustls-no-provider",
] }
env_logger = { version = "0.11.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }
hex = "0.4.3"
log = "0.4.33"
rand = "0.10.2"
purecrypto = { version = "0.7.0", default-features = false, features = [
  "rsa",
  "der",
  "std",
] }
rust-embed = { version = "8.12.0", default-features = false, features = [
  "compression",
] }
toasty = { version = "0.10.0", features = ["sqlite", "migration"] }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
rustls = { version = "0.23.43", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }

[lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
