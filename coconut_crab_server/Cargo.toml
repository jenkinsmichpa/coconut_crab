[package]
name = "coconut_crab_server"
version.workspace = true
edition.workspace = true
description = "Simulated ransomware server for incident response testing"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
coconut_crab_lib = { workspace = true }
serde = { workspace = true }
axum = { workspace = true, features = ["json", "tokio"] }
axum-embed = { workspace = true }
axum-server = { workspace = true, features = ["tls-rustls-no-provider"] }
env_logger = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
purecrypto = { workspace = true, features = ["rsa", "der", "std"] }
rust-embed = { workspace = true, features = ["compression"] }
toasty = { workspace = true, features = ["sqlite", "migration"] }
toasty-driver-sqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }

[lints]
workspace = true
