[workspace]
members = [
  "coconut_crab_client",
  "coconut_crab_server",
  "group_docx_tool",
  "coconut_crab_lib",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/jenkinsmichpa/coconut_crab"
readme = "README.md"
keywords = [
  "ransomware",
  "simulation",
  "incident-response",
  "education",
  "security",
]
categories = ["simulation", "security"]

[workspace.lints.cargo]
unused_dependencies = "warn"
unused_workspace_dependencies = "warn"
non_kebab_case_bins = "warn"
non_kebab_case_packages = "warn"
non_kebab_case_features = "warn"
non_snake_case_features = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
redundant_pub_crate = "allow" # Conflicts with `unreachable_pub`
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
wildcard_imports = "warn"
multiple_unsafe_ops_per_block = "warn"

[workspace.dependencies]
coconut-crab-lib = { path = "coconut_crab_lib" }

ahash = "0.8.14"
anyhow = "1.0.105"
auto-launch = "0.6.0"
axum = { version = "0.8.9", default-features = false }
axum-embed = "0.1.0"
axum-server = { version = "0.9.2", default-features = false }
csv = "1.4.0"
docx-rust = "0.1.11"
embed-manifest = "1.5.1"
flume = { version = "0.12.0", default-features = false }
hex = "0.4.3"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false }
litcrypt2 = "0.1.3"
purecrypto = { version = "0.10.6", default-features = false }
rand = "0.10.4"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
rust-embed = { version = "8.14.0", default-features = false }
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.19.1", default-features = false }
slint-build = "1.19.1"
thiserror = "2.0.21"
toasty = "0.11.0"
toasty-driver-sqlite = "0.11.0"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", default-features = false }
wallpaper = "3.2.0"
winresource = "0.1.34"
zip = { version = "9.8.2", default-features = false }
zlob = "1.8.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
