[workspace]
members = [
  "coconut_crab_client",
  "coconut_crab_server",
  "group_docx_tool",
  "coconut_crab_lib",
]
resolver = "2"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[workspace.dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
log = "0.4.33"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
rust-embed = { version = "8.12.0", default-features = false }
ureq = { version = "3.4.0", default-features = false }
purecrypto = { version = "0.8.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
