[workspace]
members = [
  "coconut_crab_client",
  "coconut_crab_server",
  "group_docx_tool",
  "coconut_crab_lib",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jenkinsmichpa/coconut_crab"
readme = "README.md"
keywords = [
  "ransomware",
  "simulation",
  "incident-response",
  "education",
  "security",
]
categories = ["simulation", "security"]

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[workspace.dependencies]
coconut_crab_lib = { path = "coconut_crab_lib" }

auto-launch = "0.6.0"
axum = { version = "0.8.9", default-features = false }
axum-embed = "0.1.0"
axum-server = { version = "0.8.0", default-features = false }
csv = "1.4.0"
docx-rust = "0.1.11"
embed-manifest = "1.5.1"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
flume = { version = "0.12.0", default-features = false }
hex = "0.4.3"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false }
litcrypt2 = "0.1.3"
log = "0.4.34"
purecrypto = { version = "0.9.1", default-features = false }
rand = "0.10.3"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
rust-embed = { version = "8.12.0", default-features = false }
rustls = { version = "0.23.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false }
slint-build = "1.18.1"
toasty = "0.10.0"
toasty-driver-sqlite = "0.10.0"
tokio = "1.53.1"
ureq = { version = "3.4.2", default-features = false }
wallpaper = "3.2.0"
winresource = "0.1.31"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false }
zlob = "1.6.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
