[package]
name = "coconut_crab_client"
version = "0.1.0"
authors = ["Michael Jenkins <me@jenkinsmichpa.com>"]
edition = "2024"
build = "build.rs"
description = "Simulated ransomware client for incident response testing"
license = "MIT"
repository = "https://github.com/jenkinsmichpa/coconut_crab"
readme = "../README.md"
keywords = [
  "ransomware",
  "simulation",
  "incident-response",
  "education",
  "security",
]
categories = ["simulation", "security"]

[dependencies]
coconut_crab_lib = { path = "../coconut_crab_lib" }
auto-launch = "0.6.0"
hex = { workspace = true }
rand = { workspace = true }
purecrypto = { workspace = true, features = ["rsa", "cipher", "der", "std"] }
zeroize = "1.9.0"
serde = { workspace = true }
csv = "1.4.0"
hostname = "0.4.2"
litcrypt2 = "0.1.3"
log = { workspace = true }
rust-embed = { workspace = true, features = ["include-exclude"] }
slint = { version = "1.17.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "accessibility",
  "compat-1-2",
] }
image = { version = "0.25.10", default-features = false, features = [
  "avif",
  "bmp",
  "dds",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "exr",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
env_logger = { workspace = true }
flume = { version = "0.12.0", default-features = false }
regex = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
wallpaper = "3.2.0"
zlob = "1.6.3"
[build-dependencies]
embed-manifest = "1.5.0"
winresource = "0.1.31"
slint-build = "1.17.1"

[package.metadata.winresource]
ProductName = "Coconut Crab"
OriginalFilename = "coconut_crab_client.exe"
FileDescription = "Mary-Kate and Ashley"
LegalCopyright = "jenkinsmichpa"

[lints]
workspace = true
