[package]
name = "coconut_crab_client"
version = "0.1.0"
authors = ["Michael Jenkins <jenkinsmichpa@gmail.com>"]
edition = "2024"
build = "build.rs"
description = "Simulated ransomware client for incident response testing"
license = "MIT"
repository = "https://github.com/jenkinsmichpa/coconut_crab"
readme = "../README.md"
keywords = [
  "ransomware",
  "simulation",
  "incident-response",
  "education",
  "security",
]
categories = ["simulation", "security"]

[dependencies]
coconut_crab_lib = { path = "../coconut_crab_lib" }
auto-launch = "0.6.0"
hex = "0.4.3"
rand = "0.10.2"
purecrypto = { version = "0.6.26", default-features = false, features = [
  "rsa",
  "cipher",
  "der",
  "std",
] }
zeroize = "1.9.0"
serde = { version = "1.0.228", features = ["derive"] }
csv = "1.4.0"
hostname = "0.4.2"
litcrypt2 = "0.1.3"
log = { version = "0.4.33" }
rust-embed = { version = "8.12.0", default-features = false, features = [
  "include-exclude",
] }
slint = { version = "1.17.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "accessibility",
  "compat-1-2",
] }
image = { version = "0.25.10", default-features = false, features = [
  "avif",
  "bmp",
  "dds",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "exr",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
env_logger = { version = "0.11.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }
regex = { version = "1.13.0", default-features = false, features = [
  "std",
  "perf",
] }
zip = { version = "8.6.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
wallpaper = "3.2.0"
zlob = "1.6.1"
[build-dependencies]
embed-manifest = "1.5.0"
winresource = "0.1.31"
slint-build = "1.17.1"

[package.metadata.winresource]
ProductName = "Coconut Crab"
OriginalFilename = "coconut_crab_client.exe"
FileDescription = "Mary-Kate and Ashley"
LegalCopyright = "jenkinsmichpa"
